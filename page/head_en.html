<title>EB Priority Date Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column dashboard — controls row, two summary cards, three stacked charts, table. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#111418; --ink-2:#4b5360; --ink-3:#7c8492;
  --rule:#e2e5ea; --grid:#eceef2; --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --pd:#111418; --pend:#b7bdc7; --band:#e6eefa;
  --good:#1a7f37; --bad:#c62828; --chip:#eef1f5;
  --f-display:"Source Serif 4",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --panel:#1b1e22; --ink:#f2f3f5; --ink-2:#b9bfc9; --ink-3:#8a919c;
  --rule:#2c3036; --grid:#25292e; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --pd:#f2f3f5; --pend:#4a515b; --band:#1c2736;
  --good:#4cc26a; --bad:#ef6b6b; --chip:#262a30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e22; --ink:#f2f3f5; --ink-2:#b9bfc9; --ink-3:#8a919c;
  --rule:#2c3036; --grid:#25292e; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --pd:#f2f3f5; --pend:#4a515b; --band:#1c2736;
  --good:#4cc26a; --bad:#ef6b6b; --chip:#262a30; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--f-display);font-size:26px;margin:0;text-wrap:balance;letter-spacing:.01em}
header p{margin:4px 0 0;color:var(--ink-2)}
header a{color:var(--ink-2)}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl>span{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);padding:5px 11px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
input[type=date]{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink)}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .d{font-size:12px;color:var(--ink-2)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--ink-2);margin-top:4px}
.pill.ok{color:var(--good)} .pill.no{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px 10px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:700}
.panel .sub{margin:2px 0 8px;color:var(--ink-3);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:18px;height:0;border-top:2px solid}
.lg-dash{width:18px;height:0;border-top:2px dashed}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:170px;z-index:2}
.tip b{font-family:var(--f-mono)}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{color:var(--ink-3);font-size:12.5px;max-width:75ch}
details{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 18px}
summary{cursor:pointer;font-weight:500}
.tbl{overflow-x:auto;max-height:420px;overflow-y:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;font-family:var(--f-mono)}
th{position:sticky;top:0;background:var(--panel);color:var(--ink-3);font-weight:500;font-family:var(--f-body)}
td:first-child,th:first-child{text-align:left}
.up{color:var(--good)} .dn{color:var(--bad)}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end}
.topbar>div{min-width:0}
.sync{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sync small{color:var(--ink-3);font-size:12px;text-align:right}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink-3)} .btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.spin{display:inline-block} .busy .spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy .spin{animation:none}}
select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);padding:4px 10px 4px 8px;border-radius:99px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .sw{opacity:.35}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-3);background:var(--chip)}
.chip[aria-pressed="true"] .sw{opacity:1}
.toast{font-size:12.5px;color:var(--ink-2);background:var(--chip);border-radius:8px;padding:8px 12px}
.card.na .v{color:var(--ink-3)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
nav.tabs button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink-3);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs button:focus-visible{outline:2px solid var(--c1);outline-offset:-2px}
.tabpane{display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi .d{font-size:12px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.grid2>*{min-width:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:8px 0 6px}
.chiprow b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.mini{overflow-x:auto}
.mini table td,.mini table th{font-size:12.5px}
.aos{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
.aos .lab{font-size:12px;color:var(--ink-3)}
.pill.b{color:var(--c1);font-weight:500} .pill.a{color:var(--ink-2)}
.cal{overflow-x:auto}
.cal table{border-collapse:separate;border-spacing:3px;width:auto}
.cal th,.cal td{border:0;padding:0;text-align:center;font-size:11.5px}
.cal th{position:static;color:var(--ink-3);font-weight:500;padding:0 2px 2px}
.cal td.y{text-align:right;padding-right:8px;color:var(--ink-2);font-family:var(--f-mono)}
.cal td.c{width:34px;height:24px;border-radius:4px;font-family:var(--f-mono);font-weight:600}
.cal td.B{background:var(--c1);color:#fff} .cal td.A{background:var(--chip);color:var(--ink-3)} .cal td.n{background:transparent}
.cal td.cnt{padding-left:8px;color:var(--ink-2);text-align:left;font-family:var(--f-mono)}
@media (max-width:520px){.sync{align-items:flex-start}.sync small{text-align:left}}
@media (max-width:520px){header h1{font-size:21px}.stat .v{font-size:17px}}
</style>
