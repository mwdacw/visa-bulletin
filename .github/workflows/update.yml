name: Update visa bulletin data

on:
  schedule:
    - cron: "17 15 * * *"   # daily, 15:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["page/**", "data/**", "build.py", "scrape.py", "stats.py", "aos_charts.py"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pypdf
      # Each source may fail on its own (a site down or blocking); the others still publish.
      - id: bulletin
        continue-on-error: true
        run: python scrape.py db
      - id: aos
        continue-on-error: true
        run: python aos_charts.py
      - id: stats
        continue-on-error: true
        run: python stats.py
      - run: python build.py
      - name: Commit if changed
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update data: $(python -c 'import json;print(json.load(open("docs/data.json"))["latest_bulletin"])')"
            git push
          fi
      - name: Flag failed sources
        if: steps.bulletin.outcome == 'failure' || steps.aos.outcome == 'failure' || steps.stats.outcome == 'failure'
        run: |
          echo "::error::A data source failed (bulletin=${{ steps.bulletin.outcome }}, aos=${{ steps.aos.outcome }}, stats=${{ steps.stats.outcome }}). Other sources were still published."
          exit 1
